services:
  postgres:
    image: postgres:16-alpine
    container_name: hidecraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hidecraft
      POSTGRES_USER: hidecraft
      POSTGRES_PASSWORD: hidecraft_local_dev
    ports:
      - "5435:5432"
    volumes:
      - hidecraft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidecraft -d hidecraft"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hidecraft-postgres-data:
